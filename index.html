<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>2部 勤怠管理</title><style>*{box-sizing:border-box}body{background:#111;color:#eee;font:16px system-ui;margin:0 auto;padding:18px;max-width:700px}h1{text-align:center;color:#d4b574;font-size:25px}button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #a88c55;background:#222;color:#fff}button{background:#d4b574;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}article{border:1px solid #665538;border-radius:12px;padding:14px;margin:12px 0}section{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}section div{display:grid;gap:8px}strong{font-size:24px;color:#d4b574}small{color:#aaa}header{display:flex;justify-content:space-between;align-items:center}input{max-width:100%}details{margin:20px 0}p{line-height:1.6}nav{display:flex;gap:8px;margin:18px 0}nav button{flex:1}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 4px;border-bottom:1px solid #514631;text-align:left}td button{padding:6px;font-size:12px}.scroll{overflow-x:auto}select{background:#222;color:white;padding:10px;border-radius:8px} [hidden]{display:none!important}</style><h1>CLUB KISS 2部</h1><nav><button id="normal">打刻画面</button><button id="admin">管理者画面</button></nav><div id="adminhead" hidden><h2>管理者用 勤怠一覧</h2><small>白・あいと用（認証なし）</small><p><select id="mode"><option value="daily">日別一覧</option><option value="monthly">月別集計</option></select> <input id="month" type="month" hidden></p></div><p>勤怠管理 · 営業日</p><input type="date" id="day"><p id="status"></p><main id="list"></main><div id="report" class="scroll" hidden></div><details id="manage" hidden><summary>従業員管理</summary><p>初回は従業員名を登録してください。</p><textarea id="names" rows="3" placeholder="名前を改行または読点で区切る"></textarea><button id="add">追加</button></details><button id="csv" hidden>CSV出力</button><p><small>記録はこの端末のブラウザ内に保存されます。端末間同期・認証はありません。</small></p><script>
const $=id=>document.getElementById(id),key='kiss-attendance-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{people:[],days:{}}}catch(e){db={people:[],days:{}}}function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('保存できません。ブラウザ設定を確認してください');return false}}function business(){let d=new Date();if(d.getHours()<12)d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function stamp(){let d=new Date();return String(d.getHours()+(d.getHours()<12?24:0)).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')} $('day').value=business();function el(tag,t,parent){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}let admin=false;function render(){let day=$('day').value,rows=db.days[day]||{},list=$('list');list.replaceChildren();$('status').textContent=db.people.filter(n=>rows[n]?.start&&!rows[n]?.end).length+'名 出勤中';if(admin){report();return}for(let n of db.people){let r=rows[n]||{},a=el('article','',list),h=el('header','',a);el('b',n,h);el('small',r.end?'退勤済':r.start?'出勤中':'未出勤',h);let s=el('section','',a);for(let [k,label] of [['start','出勤'],['end','退勤']]){let c=el('div','',s);el('small',label+'時間',c);el('strong',r[k]||'--:--',c);let b=el('button',label,c);b.disabled=day!==business()||!!r[k]||(k==='end'&&!r.start);b.onclick=()=>{r[k]=stamp();put(day,n,r)};}}}function put(d,n,r){(db.days[d]||=Object.create(null))[n]=r;save();render()}$('day').onchange=render;$('add').onclick=()=>{for(let n of $('names').value.split(/[、,\n]+/).map(x=>x.trim()).filter(Boolean)){if(!db.people.includes(n)&&!['__proto__','constructor','prototype'].includes(n))db.people.push(n)}save();$('names').value='';render()};$('csv').onclick=()=>{let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',out=[['営業日','氏名','出勤','退勤']];for(let [d,rows] of Object.entries(db.days))for(let [n,r] of Object.entries(rows))out.push([d,n,r.start,r.end]);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='attendance.csv';a.click()};function minutes(v){if(!v)return null;let [h,m]=v.split(':').map(Number);return h*60+m}function duration(r){let a=minutes(r.start),b=minutes(r.end);return a!==null&&b!==null&&b>=a?b-a:null}function fmt(m){return m===null?'—':Math.floor(m/60)+'h '+m%60+'m'}function report(){let box=$('report');box.replaceChildren();let monthly=$('mode').value==='monthly';$('month').hidden=!monthly;$('day').hidden=monthly;let table=el('table','',box),head=el('tr','',table);for(let h of monthly?['氏名','出勤日数','実働合計','未退勤']:['氏名','出勤','退勤','実働','修正'])el('th',h,head);for(let n of db.people){let tr=el('tr','',table);el('td',n,tr);if(monthly){let rs=Object.entries(db.days).filter(([d])=>d.startsWith($('month').value+'-')).map(([,r])=>r[n]||{});el('td',rs.filter(r=>r.start).length+'日',tr);el('td',fmt(rs.reduce((s,r)=>s+(duration(r)||0),0)),tr);el('td',String(rs.filter(r=>r.start&&!r.end).length),tr)}else{let d=$('day').value,r=db.days[d]?.[n]||{};el('td',r.start||'—',tr);el('td',r.end||'—',tr);el('td',fmt(duration(r)),tr);let b=el('button','修正',el('td','',tr));b.onclick=()=>{let start=prompt('出勤時間（例 25:00）',r.start||'');if(start===null)return;let end=prompt('退勤時間（例 30:00）',r.end||'');if(end===null)return;let valid=v=>!v||/^(?:[01][0-9]|2[0-9]|3[0-5]):[0-5][0-9]$/.test(v);if(!valid(start)||!valid(end)||(end&&(!start||minutes(end)<minutes(start)))){alert('時刻を確認してください');return}put(d,n,{start,end})}}}}function switchMode(v){admin=v;for(let id of ['adminhead','report','manage','csv'])$(id).hidden=!v;$('day').hidden=false;if(!v)$('day').value=business();render()}$('normal').onclick=()=>switchMode(false);$('admin').onclick=()=>switchMode(true);$('month').value=business().slice(0,7);$('month').onchange=render;$('mode').onchange=render;render();</script></html>
