<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>2部 勤怠管理</title><style>*{box-sizing:border-box}body{background:#111;color:#eee;font:16px system-ui;margin:0 auto;padding:18px;max-width:700px}h1{text-align:center;color:#d4b574;font-size:25px}button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #a88c55;background:#222;color:#fff}button{background:#d4b574;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.35}article{border:1px solid #665538;border-radius:12px;padding:14px;margin:12px 0}section{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}section div{display:grid;gap:8px}strong{font-size:24px;color:#d4b574}small{color:#aaa}header{display:flex;justify-content:space-between;align-items:center}input{max-width:100%}details{margin:20px 0}p{line-height:1.6}nav{display:flex;gap:8px;margin:18px 0}nav button{flex:1}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 4px;border-bottom:1px solid #514631;text-align:left}td button{padding:6px;font-size:12px}.scroll{overflow-x:auto}select{background:#222;color:white;padding:10px;border-radius:8px} [hidden]{display:none!important}article section div:first-child strong{color:#7ee2a8}article section div:last-child strong{color:#8ec5ff}article section strong{font-size:32px;font-variant-numeric:tabular-nums}article section div:first-child button{background:#7ee2a8}article section div:last-child button{background:#8ec5ff}article section small{font-size:15px}article header b{font-size:20px}td.time-in{color:#7ee2a8;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}td.time-out{color:#8ec5ff;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}td,th{white-space:nowrap}#status{font-weight:bold;color:#d4b574}</style><h1>CLUB KISS 2部</h1><article id="login"><p>従業員ログイン</p><input id="email" placeholder="ログインID" autocapitalize="none"><input id="password" type="password" placeholder="パスワード"><button id="signin">ログイン</button></article><button id="logout" hidden>ログアウト</button><div id="app" hidden><nav><button id="normal">打刻画面</button><button id="admin">管理者画面</button></nav><div id="adminhead" hidden><h2>管理者用 勤怠一覧</h2><small>管理者専用</small><p><select id="mode"><option value="daily">日別一覧</option><option value="monthly">月別集計</option></select> <input id="month" type="month" hidden></p></div><p>勤怠管理 · 営業日（18時切替）</p><input type="date" id="day"><p id="status"></p><main id="list"></main><div id="report" class="scroll" hidden></div><details id="manage" hidden><summary>従業員管理</summary><p>初回は従業員名を登録してください。</p><textarea id="names" rows="3" placeholder="名前を改行または読点で区切る"></textarea><button id="add">追加</button></details><button id="csv" hidden>CSV出力</button><p><small>勤怠記録はSupabaseに保存されます。</small></p></div><p id="error" role="alert"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const $=id=>document.getElementById(id);
const client=supabase.createClient('https://giqigcdgxbyhwgaxiwqs.supabase.co','sb_publishable_CENa512RMVL-G7C1Mc9ZBQ_kmLCFoMu');
let me=null,people=[],rows=[],admin=false,busy=false;
function business(){return new Date(Date.now()+9*3600000-18*3600000).toISOString().slice(0,10)}
function stamp(t){if(!t)return '—';let d=new Date(new Date(t).getTime()+9*3600000);return String(d.getUTCHours()+(d.getUTCHours()<18?24:0)).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}
function el(tag,t,p){let e=document.createElement(tag);e.textContent=t;p.append(e);return e}
function check(r){if(r.error)throw r.error;return r.data}
async function run(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message||String(e)}finally{busy=false}}
function fmt(m){return Math.floor(m/60)+'h '+m%60+'m'}
function duration(r){return r?.ended_at?Math.floor((new Date(r.ended_at)-new Date(r.started_at))/60000):0}
async function load(){let d=$('day').value,m=$('month').value,monthly=admin&&$('mode').value==='monthly';let q=client.from('attendance').select('*');if(monthly){let next=new Date(m+'-01T00:00:00Z');next.setUTCMonth(next.getUTCMonth()+1);q=q.gte('business_day',m+'-01').lt('business_day',next.toISOString().slice(0,10))}else q=q.eq('business_day',d);rows=check(await q);render()}
function render(){let list=$('list'),box=$('report');list.replaceChildren();box.replaceChildren();let monthly=admin&&$('mode').value==='monthly';$('day').hidden=monthly;$('month').hidden=!monthly;$('status').textContent=monthly?'月別集計':rows.filter(r=>!r.ended_at).length+'名 出勤中（閲覧可能範囲）';if(!admin){let r=rows.find(r=>r.user_id===me.id),a=el('article','',list);el('b',me.name,a);let sec=el('section','',a);for(let [k,label] of [['in','出勤'],['out','退勤']]){let c=el('div','',sec);el('small',label+'時間',c);el('strong',stamp(k==='in'?r?.started_at:r?.ended_at),c);let b=el('button',label,c);b.disabled=$('day').value!==business()||(k==='in'?!!r:!r||!!r.ended_at);b.onclick=()=>run(async()=>{if($('day').value!==business())throw Error('営業日が切り替わりました');check(await client.rpc('punch',{kind:k}));await load()})}return}
let table=el('table','',box),head=el('tr','',table);for(let h of monthly?['氏名','出勤日数','実働合計','未退勤']:['氏名','出勤','退勤','実働','修正'])el('th',h,head);for(let p of people){let tr=el('tr','',table),rs=rows.filter(r=>r.user_id===p.id),r=rs[0];el('td',p.name,tr);if(monthly){el('td',rs.length+'日',tr);el('td',fmt(rs.reduce((s,r)=>s+duration(r),0)),tr);el('td',String(rs.filter(r=>!r.ended_at).length),tr)}else{el('td',stamp(r?.started_at),tr).className='time-in';el('td',stamp(r?.ended_at),tr).className='time-out';el('td',r?.ended_at?fmt(duration(r)):'—',tr);el('button','修正',el('td','',tr)).onclick=()=>run(async()=>{let a=prompt('出勤時間（18:00〜41:59）',r?stamp(r.started_at):'');if(a===null)return;let b=prompt('退勤時間（空欄可）',r?.ended_at?stamp(r.ended_at):'');if(b===null)return;let convert=v=>{if(!/^(?:1[89]|[23][0-9]|4[01]):[0-5][0-9]$/.test(v))throw Error('時刻を確認してください');let [h,m]=v.split(':').map(Number);return new Date(Date.parse($('day').value+'T00:00:00+09:00')+(h*60+m)*60000).toISOString()};let start=convert(a),end=b?convert(b):null;if(end&&end<start)throw Error('退勤時間を確認してください');let data={user_id:p.id,business_day:$('day').value,started_at:start,ended_at:end};check(await (r?client.from('attendance').update(data).eq('user_id',p.id).eq('business_day',data.business_day):client.from('attendance').insert(data)));await load()})}}}
async function enter(session){me=check(await client.from('profiles').select('*').eq('id',session.user.id).single());people=check(await client.from('profiles').select('*').order('name'));$('login').hidden=true;$('app').hidden=false;$('logout').hidden=false;$('admin').hidden=!me.admin;await mode(false)}
async function mode(v){admin=v&&me.admin;for(let id of ['adminhead','report','csv'])$(id).hidden=!admin;$('manage').hidden=true;if(!admin)$('day').value=business();await load()}
$('day').value=business();$('month').value=business().slice(0,7);
$('signin').onclick=()=>run(async()=>{let email=$('email').value.trim();if(!email.includes('@'))email+='@kiss.example';let data=check(await client.auth.signInWithPassword({email,password:$('password').value}));$('password').value='';await enter(data.session)});
$('logout').onclick=()=>run(async()=>{check(await client.auth.signOut());location.reload()});
$('normal').onclick=()=>run(()=>mode(false));$('admin').onclick=()=>run(()=>mode(true));for(let id of ['day','month','mode'])$(id).onchange=()=>run(load);
$('csv').onclick=()=>run(async()=>{if(!me.admin)return;let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let out=[['営業日','氏名','出勤','退勤'],...rows.map(r=>[r.business_day,people.find(p=>p.id===r.user_id)?.name,stamp(r.started_at),stamp(r.ended_at)])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='attendance.csv';a.click()});
let last=business();setInterval(()=>{if(!me)return;run(async()=>{let d=business();if(d!==last){if($('day').value===last)$('day').value=d;if($('month').value===last.slice(0,7))$('month').value=d.slice(0,7);last=d}await load()})},30000);
run(async()=>{let data=check(await client.auth.getSession());if(data.session)await enter(data.session)});
</script></html>
